[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trishula-memory"
version = "1.0.0"
description = "Sovereign, framework-free persistent agent memory engine. Pure SQLite and local vector embeddings. Zero LangChain."
authors = [{name = "Trishula Software", email = "trishulasoftware@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0"
]
